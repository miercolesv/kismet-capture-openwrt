name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/workflows/docs.yml']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      release:
        description: OpenWrt release (e.g. 25.12.6)
        default: '25.12.6'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # the OpenWrt SDK only ships x86_64 host binaries
    env:
      RELEASE: ${{ inputs.release || '25.12.6' }}
      TARGET: qualcommax/ipq60xx
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext git libncurses-dev \
            python3 python3-setuptools rsync unzip wget file zstd zlib1g-dev qemu-user-static

      # Caches the extracted SDK including the already-built dependencies
      # (libpcap, libnl-tiny, mbedtls, libwebsockets), so later runs only build Kismet.
      - name: Restore SDK cache
        id: sdkcache
        uses: actions/cache/restore@v4
        with:
          path: work/openwrt-sdk-*
          key: sdk-${{ env.RELEASE }}-${{ env.TARGET }}-v2-${{ github.run_id }}
          restore-keys: |
            sdk-${{ env.RELEASE }}-${{ env.TARGET }}-v2-

      - name: Build and smoke test
        run: ./scripts/build.sh

      # Saved even when the Kismet build fails, so the dependencies are not rebuilt next run.
      - name: Save SDK cache
        if: always() && steps.sdkcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/openwrt-sdk-*
          key: sdk-${{ env.RELEASE }}-${{ env.TARGET }}-v2-${{ github.run_id }}

      - name: Package version
        id: ver
        run: |
          mk() { sed -n "s/^$2:=//p" "net/$1/Makefile"; }
          v="$(mk kismet PKG_VERSION)-r$(mk kismet-capture PKG_RELEASE).$(mk kismet PKG_RELEASE)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum *.apk) | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kismet-capture-${{ env.RELEASE }}-ipq60xx
          path: |
            dist/
            work/build.log
          if-no-files-found: ignore

      - name: Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}-openwrt${RELEASE}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists, bump PKG_RELEASE to publish a new one"
            exit 0
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          {
            echo "Kismet 2026-10-R1 for OpenWrt ${RELEASE}, aarch64_cortex-a53"
            echo "(e.g. GL.iNet GL-AXT1800 / GL-AX1800 on qualcommax/ipq60xx, Cudy TR3000 and other mediatek/filogic MT7981/MT7986 routers)."
            echo
            echo "| Package | What |"
            echo "|---|---|"
            echo "| kismet-capture-linux-wifi | Wi-Fi capture tool (remote or local) |"
            echo "| kismet-server | Kismet server + web UI on port 2501 |"
            echo "| kismet-capture-sdr | RTL-SDR tools: ADS-B aircraft, rtl_433 sensors, AIS ships |"
            echo
            echo "Install on the router (pick the packages you want):"
            echo '```sh'
            echo "cd /tmp"
            for f in dist/*.apk; do echo "wget ${url}/$(basename "$f")"; done
            echo "apk add --allow-untrusted ./kismet-*.apk"
            echo '```'
          } > notes.md
          gh release create "$tag" dist/*.apk dist/SHA256SUMS --title "$tag" --notes-file notes.md
