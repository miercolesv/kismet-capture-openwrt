# Router defaults for Kismet. This file overrides kismet.conf and its includes,
# and is kept across package upgrades. Capture sources and logging are set in
# /etc/config/kismet (uci), not here.

# Keep memory bounded on a 256-512 MB router:
# forget devices not seen for 30 minutes, track at most 3000 at once.
tracker_device_timeout=1800
tracker_max_devices=3000
# Per-device history graphs cost RAM per device; off by default.
track_device_rrds=false
keep_per_datasource_stats=false
alertbacklog=25

# Don't write into flash if logging gets enabled without a prefix.
log_prefix=/tmp/
